{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto px-4 sm:px-0">
    <div class="glass-panel p-6 sm:p-8 md:p-10 rounded-[30px] md:rounded-[40px] shadow-2xl form-card relative overflow-hidden backdrop-blur-2xl">
        <h2 class="text-3xl md:text-4xl font-sans font-bold text-center mb-2 text-gray-800 tracking-tight">Welcome Back</h2>
        <p class="text-center text-gray-400 mb-10 font-serif italic stagger-1 fade-up">Your style journey continues</p>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <!-- Username/Email Input -->
            <div class="input-group stagger-2 fade-up">
                <input type="text" name="username" id="username" class="input-field" placeholder=" " required>
                <label for="username" class="input-label">Email or Username</label>
            </div>

            <!-- Password Input -->
            <div class="input-group stagger-3 fade-up">
                <input type="password" name="password" id="password" class="input-field" placeholder=" " required>
                <label for="password" class="input-label">Password</label>
            </div>

            <button type="submit"
                class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-xl mt-4 fade-up stagger-4">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-8 fade-up stagger-5">
            New here? <a href="{{ url_for('signup') }}" class="text-theme-pink font-bold hover:underline">Create
                Account</a>
        </p>
    </div>
</div>
{% endblock %}
