{% extends "base.html" %}

{% block content %}
<section id="hero-section"
    class="w-full max-w-4xl text-center space-y-4 animate-fade-in-up py-12 relative z-10 flex flex-col items-center justify-center">
    <h1 class="text-5xl md:text-7xl font-sans font-bold text-gray-800 leading-tight">
        Your <span class="text-shimmer">Style,</span><br>
        <span class="font-normal text-gray-700">One</span> <span class="text-shimmer">Step</span> <span
            class="font-normal text-gray-700">Ahead</span>
    </h1>
    <p class="text-lg md:text-xl text-gray-600 max-w-2xl mx-auto font-serif italic font-medium mt-8">
        AI-powered beauty and wardrobe analysis
    </p>

    <!-- Drifting Tokens with Staggered Entrance (Bubble Style) -->
    <div class="floating-token bubble-stagger top-[12%] left-[8%]" style="animation-delay: 0.1s;">🎀</div>
    <div class="floating-token bubble-stagger top-[22%] right-[12%]" style="animation-delay: 0.3s;">💅</div>
    <div class="floating-token bubble-stagger bottom-[22%] left-[12%]" style="animation-delay: 0.5s;">🌸</div>
    <div class="floating-token bubble-stagger bottom-[32%] right-[10%]" style="animation-delay: 0.7s;">🩰</div>
    <div class="floating-token bubble-stagger top-[45%] left-[5%]" style="animation-delay: 0.9s;">🧖‍♀️</div>
    <div class="floating-token bubble-stagger top-[65%] right-[3%]" style="animation-delay: 1.1s;">🛍️</div>



    <!-- 3D Single Door -->
    <div class="mt-8 relative z-10 animate-fade-in-up flex flex-col items-center"
        style="animation-delay: 0.2s; animation-fill-mode: both;">
        <p class="text-sm text-theme-purple font-bold uppercase tracking-widest mb-6">Step Inside</p>
        <a href="{{ url_for('login') }}"
            class="single-door-wrapper tilt-card block relative cursor-pointer group perspective-1000">
            <!-- Arched Room -->
            <div
                class="relative w-[180px] h-[280px] rounded-t-[90px] bg-white/60 backdrop-blur-md shadow-2xl border-4 border-white flex flex-col items-center justify-center overflow-hidden">
                <!-- Inner Radiant Glow -->
                <div class="radiant-glow-effect"></div>

                <span
                    class="font-bold text-gray-800 text-sm tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-300 z-10">Get
                    Started</span>

                <!-- The Single Door Panel (Lilac Blurred) -->
                <div
                    class="door-panel absolute inset-0 bg-theme-purple/60 backdrop-blur-md origin-left transition-transform duration-[800ms] ease-in-out flex items-center shadow-lg border-r border-white/20">
                    <!-- Top Arch Pane Detail -->
                    <div
                        class="absolute top-4 left-[15%] right-[15%] h-[20%] rounded-t-[40px] border-[3px] border-white/40">
                    </div>
                    <!-- Middle Panels detail -->
                    <div class="absolute top-[32%] left-[15%] right-[15%] h-[25%] border-[3px] border-white/40"></div>
                    <!-- Bottom Panels detail -->
                    <div class="absolute bottom-6 left-[15%] right-[15%] h-[35%] border-[3px] border-white/40"></div>
                    <!-- Door Knob -->
                    <div
                        class="absolute right-3 w-4 h-4 rounded-full bg-theme-yellow shadow-md transform -translate-y-1/2 border border-white/20">
                    </div>
                </div>
            </div>
        </a>
    </div>
</section>
{% endblock %}
